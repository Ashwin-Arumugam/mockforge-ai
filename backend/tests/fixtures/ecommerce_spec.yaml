openapi: 3.0.3
info:
  title: PetStore & E-Commerce Integration API
  version: 1.2.0
  description: Real-world sample OpenAPI spec for MockForge verification
paths:
  /pets:
    post:
      summary: Add a new pet to the store
      operationId: addPet
      requestBody:
        description: Pet object that needs to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Pet created successfully
    get:
      summary: List all pets
      operationId: listPets
      responses:
        '200':
          description: A list of pets
  /pets/{petId}:
    get:
      summary: Find pet by ID
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pet object found
    delete:
      summary: Delete a pet
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pet deleted
  /pets/{petId}/orders:
    get:
      summary: Get orders for a specific pet
      operationId: getPetOrders
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of pet adoption orders
components:
  schemas:
    Pet:
      type: object
      required:
        - name
        - category
      properties:
        id:
          type: string
        name:
          type: string
          example: Doggie
        category:
          type: string
          example: Dogs
        status:
          type: string
          enum:
            - available
            - pending
            - adopted
          default: available
